# Shared standalone crate: no workspace inheritance, so it can move to its own
# GitHub repository as-is — the game then redirects its dependency from `path`
# to `git` in the root [workspace.dependencies], and the msg_post_process
# path below likewise becomes a `git` dependency.

[package]
name = "msg_shaders"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "MSG studio shader effects for Bevy: black holes, gravitational lensing, color quantization, and pixelation"
repository = "https://github.com/ffmulks/gravitaria"
readme = "README.md"
keywords = ["bevy", "shader", "blackhole", "quantization", "pixelation"]

[features]
default = ["render_2d"]
render_2d = []
render_3d = []

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_render",
    "bevy_pbr",
    "bevy_sprite",
    "bevy_sprite_render",
] }
msg_post_process = { path = "../crates/msg_post_process" }

[dev-dependencies]
# Offline validation of the pure-WGSL compute shaders (no GPU required).
naga = { version = "27", features = ["wgsl-in"] }
# The windowed example needs the full engine (windowing, input, defaults).
bevy = { version = "0.18" }

[lints.rust]
# Mark `bevy_lint` as a valid `cfg`, as it is set when the Bevy linter runs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_lint)"] }

[lints.clippy]
# Bevy supplies arguments to systems via dependency injection, so it's natural
# for systems to request more than 7 arguments, which would undesirably trigger
# this lint; queries likewise access many components.
too_many_arguments = "allow"
type_complexity = "allow"
# Make sure macros use their standard braces, such as `[]` for `bevy_ecs::children!`.
nonstandard_macro_braces = "warn"
