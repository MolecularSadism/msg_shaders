# CI for msg_shaders as a standalone repository.
#
# Inert inside the Gravitaria monorepo (workflows only run from the repo
# root, and there the parent workspace's CI covers this crate); it becomes
# active as-is when this folder is published as its own repo. Before that
# move, redirect the msg_post_process path dependency to `git` and refresh
# Cargo.lock (see README "Standalone use"). Runs on stable — no nightly
# features are used.

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The windowed example builds the full engine; Bevy's default features
      # need the audio and input system headers on Linux.
      - name: Install build dependencies
        run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Plain `cargo test` so doc tests run too (`--all-targets` would skip them).
      - name: Tests (includes offline WGSL validation via naga)
        run: cargo test --locked
