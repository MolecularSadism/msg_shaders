# Workspace-independent manifest — see the note in ../Cargo.toml.

[package]
name = "bevy_post_process_2d"
version = "0.1.0"
edition = "2024"
description = "Central ordering registry for 2D full-screen post-process render-graph passes in Bevy."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ffmulks/gravitaria"
readme = "README.md"
keywords = ["bevy", "render", "post-process", "2d", "gamedev"]

[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    "bevy_render",
    "bevy_core_pipeline",
] }

[lints.rust]
# Mark `bevy_lint` as a valid `cfg`, as it is set when the Bevy linter runs.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_lint)"] }

[lints.clippy]
# Bevy supplies arguments to systems via dependency injection; queries access
# many components.
too_many_arguments = "allow"
type_complexity = "allow"
nonstandard_macro_braces = "warn"
